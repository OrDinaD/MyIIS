name: TestFlight

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional MARKETING_VERSION override, for example 1.0.7"
        required: false
        type: string
      upload_to_testflight:
        description: "Upload to App Store Connect"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: testflight-release
  cancel-in-progress: false

env:
  PROJECT_PATH: MyIIS.xcodeproj
  SCHEME: MyIIS
  CONFIGURATION: Release
  TEAM_ID: Y85TSUMM4F
  BUNDLE_ID: com.OrDinaD.MyIIS
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
  APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
  APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
  IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
  IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}

jobs:
  deploy:
    name: Archive & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Verify upload credentials
        id: credentials
        shell: bash
        env:
          REQUESTED_UPLOAD: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail

          SHOULD_UPLOAD=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$REQUESTED_UPLOAD" == "false" ]]; then
            SHOULD_UPLOAD=false
          fi

          echo "should_upload=$SHOULD_UPLOAD" >> "$GITHUB_OUTPUT"
          if [[ "$SHOULD_UPLOAD" == "false" ]]; then
            echo "::notice::Upload disabled for this manual run."
            exit 0
          fi

          missing=()
          [[ -n "$APPSTORE_API_KEY_ID" ]] || missing+=("APPSTORE_API_KEY_ID")
          [[ -n "$APPSTORE_API_ISSUER_ID" ]] || missing+=("APPSTORE_API_ISSUER_ID")
          [[ -n "$APPSTORE_API_PRIVATE_KEY" ]] || missing+=("APPSTORE_API_PRIVATE_KEY")
          [[ -n "$IOS_SIGNING_CERTIFICATE_BASE64" ]] || missing+=("IOS_SIGNING_CERTIFICATE_BASE64")
          [[ -n "$IOS_SIGNING_CERTIFICATE_PASSWORD" ]] || missing+=("IOS_SIGNING_CERTIFICATE_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Prepare App Store Connect API key
        id: asc_key
        if: steps.credentials.outputs.should_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"

          printf '%s' "$APPSTORE_API_PRIVATE_KEY" | sed $'s/\\\\n/\\\n/g' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          BUILD_SETTINGS="$(xcodebuild -showBuildSettings \
            -project "$PROJECT_PATH" \
            -target "$SCHEME" \
            -configuration "$CONFIGURATION")"
          PROJECT_VERSION="$(awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }' <<< "$BUILD_SETTINGS")"

          if [[ "${{ steps.credentials.outputs.should_upload }}" == "true" ]]; then
            VERSION_JSON="$(python3 .github/scripts/resolve_app_store_version.py \
              --project-version "$PROJECT_VERSION" \
              --requested-version "$REQUESTED_VERSION" \
              --bundle-id "$BUNDLE_ID" \
              --key-id "$APPSTORE_API_KEY_ID" \
              --issuer-id "$APPSTORE_API_ISSUER_ID" \
              --key-path "${{ steps.asc_key.outputs.key_path }}")"
            VERSION="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<< "$VERSION_JSON")"
            VERSION_SOURCE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["source"])' <<< "$VERSION_JSON")"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="$REQUESTED_VERSION"
            VERSION_SOURCE="workflow input"
          else
            VERSION="$PROJECT_VERSION"
            VERSION_SOURCE="Xcode project"
          fi

          # A UTC timestamp is monotonic for serialized deploys and does not
          # depend on a manually maintained CURRENT_PROJECT_VERSION value.
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"

          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version $VERSION from $VERSION_SOURCE; build $BUILD_NUMBER."

      - name: Import reusable signing certificate
        id: signing
        if: steps.credentials.outputs.should_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/MyIIS-CI.p12"
          CI_KEYCHAIN_PATH="$RUNNER_TEMP/MyIIS-CI.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          printf '%s' "$IOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$CI_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$CI_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$CI_KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$CI_KEYCHAIN_PATH" \
            -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" \
            -A \
            -t agg \
            -f pkcs12 \
            >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$CI_KEYCHAIN_PATH" \
            >/dev/null
          security list-keychains -d user -s "$CI_KEYCHAIN_PATH"
          security default-keychain -d user -s "$CI_KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity \
            -v \
            -p codesigning \
            "$CI_KEYCHAIN_PATH" |
            awk '/Apple Development/ { print $2; exit }')"

          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::The imported certificate does not contain a valid Apple Development identity."
            exit 1
          fi

          echo "Reusable signing identity imported successfully."

      - name: Verify release settings
        if: steps.credentials.outputs.should_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -showBuildSettings \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="${{ steps.metadata.outputs.build_number }}" \
            MARKETING_VERSION="${{ steps.metadata.outputs.marketing_version }}" \
            CODE_SIGN_IDENTITY="Apple Development" |
            grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY'

      - name: Archive signed app
        if: steps.credentials.outputs.should_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          xcodebuild clean archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyIIS.xcarchive \
            CURRENT_PROJECT_VERSION="${{ steps.metadata.outputs.build_number }}" \
            MARKETING_VERSION="${{ steps.metadata.outputs.marketing_version }}" \
            CODE_SIGN_IDENTITY="Apple Development" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/MyIIS-CI.keychain-db" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.key_path }}" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Create TestFlight export options
        if: steps.credentials.outputs.should_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail

          plutil -create xml1 build/ExportOptions-TestFlight.plist
          plutil -insert method -string app-store-connect build/ExportOptions-TestFlight.plist
          plutil -insert destination -string upload build/ExportOptions-TestFlight.plist
          plutil -insert signingStyle -string automatic build/ExportOptions-TestFlight.plist
          plutil -insert teamID -string "$TEAM_ID" build/ExportOptions-TestFlight.plist
          plutil -insert distributionBundleIdentifier -string "$BUNDLE_ID" build/ExportOptions-TestFlight.plist
          plutil -insert manageAppVersionAndBuildNumber -bool true build/ExportOptions-TestFlight.plist
          plutil -insert stripSwiftSymbols -bool true build/ExportOptions-TestFlight.plist
          plutil -insert uploadSymbols -bool true build/ExportOptions-TestFlight.plist

      - name: Upload to TestFlight
        if: steps.credentials.outputs.should_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath build/MyIIS.xcarchive \
            -exportOptionsPlist build/ExportOptions-TestFlight.plist \
            -exportPath build/TestFlightUpload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.key_path }}" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Upload release diagnostics
        if: ${{ always() && steps.credentials.outputs.should_upload == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: testflight-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ExportOptions-TestFlight.plist
            build/*.xcarchive
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing keychain
        if: ${{ always() && steps.signing.outcome != 'skipped' }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/MyIIS-CI.keychain-db" 2>/dev/null || true
