name: TestFlight

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional MARKETING_VERSION override, for example 0.6.8"
        required: false
        type: string
      upload_to_testflight:
        description: "Upload to App Store Connect when credentials are available"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: MyIIS.xcodeproj
  SCHEME: MyIIS
  CONFIGURATION: Release
  TEAM_ID: Y85TSUMM4F
  BUNDLE_ID: com.OrDinaD.MyIIS
  XCODE_PATH: /Applications/Xcode_26.5.app
  TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17
  APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
  APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
  APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_PATH"

      - name: Build for Testing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$TEST_DESTINATION"

      - name: Run Tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "$TEST_DESTINATION" \
            -parallel-testing-enabled NO \
            -only-testing:MyIISTests

  deploy:
    name: Archive & Upload to TestFlight
    needs: test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_PATH"

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          BUILD_SETTINGS="$(xcodebuild -showBuildSettings \
            -project "$PROJECT_PATH" \
            -target "$SCHEME" \
            -configuration "$CONFIGURATION")"

          PROJECT_BUILD_NUMBER="$(awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / { print $2; exit }' <<< "$BUILD_SETTINGS")"
          PROJECT_VERSION="$(awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }' <<< "$BUILD_SETTINGS")"

          if [[ ! "$PROJECT_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::CURRENT_PROJECT_VERSION must be an integer, got '$PROJECT_BUILD_NUMBER'."
            exit 1
          fi

          BUILD_NUMBER="$((PROJECT_BUILD_NUMBER + 1))"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_version }}" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="$PROJECT_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]; then
            echo "::error::MARKETING_VERSION must contain two or three numeric components, got '$VERSION'."
            exit 1
          fi

          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Archiving version $VERSION, build $BUILD_NUMBER (project build $PROJECT_BUILD_NUMBER + 1)."

      - name: Verify release settings
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -showBuildSettings \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="${{ steps.metadata.outputs.build_number }}" \
            MARKETING_VERSION="${{ steps.metadata.outputs.marketing_version }}" |
            grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM'

      - name: Detect App Store Connect credentials
        id: asc
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$APPSTORE_API_KEY_ID" && -n "$APPSTORE_API_ISSUER_ID" && -n "$APPSTORE_API_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect credentials are configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect secrets are missing. This run will build and test only."
          fi

      - name: Prepare App Store Connect API key
        id: asc_key
        if: ${{ steps.asc.outputs.available == 'true' && (github.event_name == 'push' || inputs.upload_to_testflight) }}
        shell: bash
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"

          printf '%s' "$APPSTORE_API_PRIVATE_KEY" | sed $'s/\\\\n/\\\n/g' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive signed app
        if: ${{ steps.asc_key.outputs.key_path != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          xcodebuild clean archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyIIS.xcarchive \
            CURRENT_PROJECT_VERSION="${{ steps.metadata.outputs.build_number }}" \
            MARKETING_VERSION="${{ steps.metadata.outputs.marketing_version }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.key_path }}" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Create TestFlight export options
        if: ${{ steps.asc_key.outputs.key_path != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          plutil -create xml1 build/ExportOptions-TestFlight.plist
          plutil -insert method -string app-store-connect build/ExportOptions-TestFlight.plist
          plutil -insert destination -string upload build/ExportOptions-TestFlight.plist
          plutil -insert signingStyle -string automatic build/ExportOptions-TestFlight.plist
          plutil -insert teamID -string "$TEAM_ID" build/ExportOptions-TestFlight.plist
          plutil -insert distributionBundleIdentifier -string "$BUNDLE_ID" build/ExportOptions-TestFlight.plist
          plutil -insert manageAppVersionAndBuildNumber -bool false build/ExportOptions-TestFlight.plist
          plutil -insert stripSwiftSymbols -bool true build/ExportOptions-TestFlight.plist
          plutil -insert uploadSymbols -bool true build/ExportOptions-TestFlight.plist

      - name: Upload to TestFlight
        if: ${{ steps.asc_key.outputs.key_path != '' }}
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath build/MyIIS.xcarchive \
            -exportOptionsPlist build/ExportOptions-TestFlight.plist \
            -exportPath build/TestFlightUpload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.key_path }}" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Upload archive logs
        if: ${{ always() && steps.asc_key.outputs.key_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-artifacts
          path: |
            build/ExportOptions-TestFlight.plist
            build/*.xcarchive
          if-no-files-found: ignore
