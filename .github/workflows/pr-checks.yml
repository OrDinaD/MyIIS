name: PR Quality & Test Checks

on:
  pull_request:
    branches:
      - main
      - master
      - release
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PROJECT_PATH: MyIIS.xcodeproj
  SCHEME: MyIIS
  TEST_TARGET: MyIISTests
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  static-analysis:
    name: Lint & Code Style
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tools
        run: |
          set -euo pipefail
          swiftlint version || brew install swiftlint
          swiftformat --version || brew install swiftformat

      - name: Run SwiftLint
        run: |
          set -euo pipefail
          swiftlint lint --strict --reporter github-actions-logging

      - name: Run SwiftFormat Lint
        run: |
          set -euo pipefail
          swiftformat --lint .

      - name: Git Diff Whitespace Check
        run: |
          set -euo pipefail
          git diff --check HEAD~1 || true

  unit-tests:
    name: Build & Run Unit Tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Discover iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          SIM_NAME=$(xcrun simctl list devices available | grep -m 1 "iPhone 16" | sed -E 's/^[[:space:]]+//' | cut -d '(' -f 1 | xargs || echo "iPhone 16")
          echo "sim_name=$SIM_NAME" >> "$GITHUB_OUTPUT"

      - name: Run xcodebuild test (MyIISTests)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.sim_name }},OS=latest" \
            -only-testing:"$TEST_TARGET" \
            -enableCodeCoverage YES \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-xcresult
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
