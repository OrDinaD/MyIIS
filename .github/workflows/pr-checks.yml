name: CI Quality & Test Checks

# Triggers
on:
  push:
    branches:
      - main
      - master
      - release
  pull_request:
    branches:
      - main
      - master
      - release
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PROJECT_PATH: MyIIS.xcodeproj
  SCHEME: MyIIS
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

# Quality checks
jobs:
  static-analysis:
    name: Lint & Code Style
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tools
        run: |
          set -euo pipefail
          swiftlint version || brew install swiftlint
          swiftformat --version || brew install swiftformat

      - name: Run SwiftLint
        run: |
          set -euo pipefail
          swiftlint lint --strict --reporter github-actions-logging

      - name: Run SwiftFormat Lint
        # Existing formatting debt remains advisory, with a visible failed step.
        continue-on-error: true
        run: swiftformat --lint .

      - name: Git Diff Whitespace Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi

  # Strict feedback for pushes and pull requests.
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/ios-tests.yml
    with:
      max_failure_percent: 0
