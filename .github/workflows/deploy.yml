name: Build and Deploy to SideStore

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Build unsigned IPA
        run: |
          # Создаем директорию для сборки
          mkdir -p build
          
          # Собираем проект для iOS (ad-hoc, без подписи)
          xcodebuild clean archive \
            -project MyIIS.xcodeproj \
            -scheme MyIIS \
            -configuration Release \
            -archivePath build/MyIIS.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
          
          # Экспортируем IPA
          mkdir -p build/Payload
          cp -r build/MyIIS.xcarchive/Products/Applications/MyIIS.app build/Payload/
          
          # Создаем IPA
          cd build
          zip -r MyIIS.ipa Payload
          cd ..
          
          # Копируем файлы в корень для GitHub Pages
          cp build/MyIIS.ipa ./MyIIS.ipa
          cp MyIIS/Assets.xcassets/AppIcon.appiconset/Icon-iOS-Default-1024x1024@1x.png ./icon.png
          
          # Получаем размер файла
          FILE_SIZE=$(stat -f%z build/MyIIS.ipa)
          echo "ipa_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "IPA size: $FILE_SIZE bytes"
        id: build

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: build/MyIIS.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update apps.json
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime, timezone
          
          try:
              # Читаем текущий apps.json
              with open('apps.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              # Данные из окружения GitHub Actions
              version = os.environ.get('APP_VERSION', '0.0.0')
              file_size_str = os.environ.get('IPA_SIZE', '0')
              file_size = int(file_size_str) if file_size_str else 0
              
              download_url = "https://ordinad.github.io/MyIIS/MyIIS.ipa"
              icon_url = "https://ordinad.github.io/MyIIS/icon.png"
              
              current_date = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              
              new_version = {
                  "version": version,
                  "date": current_date,
                  "size": file_size,
                  "downloadURL": download_url,
                  "localizedDescription": f"Релиз версии {version}"
              }
              
              for app in data['apps']:
                  if app['bundleIdentifier'] == 'com.OrDinaD.MyIIS':
                      app['iconURL'] = icon_url
                      
                      existing_versions = [v['version'] for v in app['versions']]
                      if version not in existing_versions:
                          app['versions'].insert(0, new_version)
                      else:
                          for i, v in enumerate(app['versions']):
                              if v['version'] == version:
                                  app['versions'][i] = new_version
                                  break
                      
                      app['versions'] = app['versions'][:10]
                      break
              
              with open('apps.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write('\n')
              print(f"Successfully updated apps.json to version {version}")
          except Exception as e:
              print(f"Error updating apps.json: {e}")
              exit(1)
          EOF
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          IPA_SIZE: ${{ steps.build.outputs.ipa_size }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Переключаемся на main, так как мы в состоянии detached HEAD (из-за тега)
          git fetch origin main
          git checkout main
          
          git add apps.json MyIIS.ipa icon.png
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SideStore release: v${{ steps.version.outputs.version }}"
            git push origin main
          fi
